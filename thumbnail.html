<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./styles.css">
<style>html,body{margin:0}
.tile{width:1280px;height:854px;display:flex;font-family:var(--font-sans);overflow:hidden}
.main{width:75%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;padding:0 60px}
.name{color:#fff;font-size:130px;font-weight:700;letter-spacing:-0.02em;line-height:1.02;text-align:center}
.strip{flex:1;display:flex;flex-direction:column}
.strip>div{flex:1}</style></head>
<body>
<div class="tile">
  <div class="main"><span class="name">Blue Insights</span></div>
  <div class="strip">
    <div style="background:#38BDF8"></div>
    <div style="background:#16A34A"></div>
    <div style="background:#0284C7"></div>
    <div style="background:#1D4ED8"></div>
  </div>
</div>
</body></html>
