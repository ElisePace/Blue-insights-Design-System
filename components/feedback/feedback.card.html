<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-canvas);padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted)}
.btns{display:flex;gap:10px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const { Alert, ProgressBar, Modal, Button, Checkbox } = window.TomoroDesignSystem_e2b93e;
function Demo(){
  const [open,setOpen] = React.useState(false);
  return <div className="stack">
    <span className="lbl">Alerts</span>
    <Alert tone="warning" title="Review before sharing — 1 sensitive figure">12%</Alert>
    <Alert tone="transparency" title="How this was generated.">The agent joined three sources and weighted recent records higher.</Alert>
    <span className="lbl">Progress · agent working</span>
    <ProgressBar value={42}/>
    <div className="btns"><Button onClick={()=>setOpen(true)}>Open dialog</Button></div>
    {open && <Modal title="Review before sharing" subtitle="Nothing is exported until you confirm." onClose={()=>setOpen(false)}
       footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancel</Button><Button>Copy / share</Button></>}>
       <Checkbox checked boxed label="I've reviewed this and the figures are OK to share"/>
    </Modal>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
