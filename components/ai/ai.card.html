<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body><div id="root"></div>
<script type="text/babel">
const { FindingSection, AiChip, SourceRow, RefBadge, StepList } = window.TomoroDesignSystem_e2b93e;
function Demo(){
  const [open,setOpen] = React.useState('evidence');
  return <div className="grid">
    <div className="stack">
      <FindingSection tone="evidence" label="Evidence" meta="3 facts" open={open==='evidence'} onToggle={()=>setOpen(open==='evidence'?'':'evidence')}>
        EMEA enterprise renewals fell <b>28%</b> vs prior quarter <RefBadge n={1}/>
      </FindingSection>
      <FindingSection tone="assumption" label="Assumption" open={open==='assumption'} onToggle={()=>setOpen(open==='assumption'?'':'assumption')}>
        Assumes the 4 renewals still "in negotiation" are treated as churned <RefBadge n={2}/>.
      </FindingSection>
      <FindingSection tone="unknown" label="Unknown" open={open==='unknown'} onToggle={()=>setOpen(open==='unknown'?'':'unknown')}>
        Can't confirm whether Q3 discount changes affected deal size.
      </FindingSection>
    </div>
    <div className="stack">
      <span className="lbl">AI trust chips</span>
      <div className="chips">
        <AiChip kind="accountability">Accountability · audit trail</AiChip>
        <AiChip kind="consent">Consent · opt-in</AiChip>
        <AiChip kind="bias">Bias monitor · fairness flag</AiChip>
      </div>
      <span className="lbl" style={{marginTop:6}}>Sources · step list</span>
      <SourceRow n={1} name="Revenue warehouse — Q3 rollup"/>
      <SourceRow n={2} name="Renewals tracker (CSV)"/>
      <StepList steps={[{label:'Analysing the annotation',state:'done'},{label:'Retrieving sources',state:'active',note:'3/3…'},{label:'Checking the figures',state:'pending'}]}/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
