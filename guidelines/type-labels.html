<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-canvas);padding:20px;color:var(--color-text-primary);display:flex;gap:40px;align-items:center}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--color-primary)}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
.sub{font-size:11px;color:var(--color-text-muted);margin-top:4px}</style></head>
<body>
<div><div class="eyebrow">Real example · in use</div><div class="sub">Eyebrow · .14em · Primary</div></div>
<div><div class="label">Sources in scope</div><div class="sub">Section label · .06em · Muted</div></div>
</body></html>
