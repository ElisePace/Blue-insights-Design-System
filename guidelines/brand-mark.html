<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-canvas);padding:20px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mark{width:36px;height:36px;border-radius:var(--radius-md);background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700}
.name{font-size:20px;font-weight:600;color:var(--color-text-primary)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:12px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--color-surface-2);color:var(--color-text-primary);border:1px solid var(--color-border)}</style></head>
<body>
<div class="brand"><span class="mark">b</span><span class="name">Blue Insights</span></div>
<div class="pills">
<span class="pill">Reliable</span><span class="pill">Interpretable</span><span class="pill">Trustworthy</span>
<span class="pill">Professional</span><span class="pill">Calm</span><span class="pill">Data-first</span><span class="pill">High legibility</span>
</div></body></html>
