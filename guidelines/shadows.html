<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Restrained shadows — depth from layered surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-surface-1);padding:26px 20px;display:flex;gap:26px;align-items:center}
.item{text-align:center}
.box{width:110px;height:60px;background:var(--color-canvas);border:1px solid var(--color-border);border-radius:var(--radius-xl)}
.n{font-size:11px;font-weight:600;color:var(--color-text-primary);margin-top:10px}
.v{font-size:10px;color:var(--color-text-muted)}</style></head>
<body>
<div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div></div>
<div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm · cards</div></div>
<div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="n">md · callouts</div></div>
<div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg · modals</div></div>
</body></html>
