<!-- @dsCard group="Colors" viewport="700x160" name="AI trust semantics" subtitle="Interpretability palette — accountability, consent, privacy, risk, bias" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-canvas);padding:16px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
.chip{height:46px}
.meta{padding:6px 8px}
.n{font-size:10.5px;font-weight:600;color:var(--color-text-primary);line-height:1.25}
.h{font-size:10px;font-weight:500;color:var(--color-text-muted);font-feature-settings:'tnum' 1;margin-top:1px}</style></head>
<body><div class="row">
<div class="sw"><div class="chip" style="background:var(--color-ai-accountability)"></div><div class="meta"><div class="n">Accountability</div><div class="h">#1D4ED8</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-ai-consent)"></div><div class="meta"><div class="n">Consent</div><div class="h">#C6F1D6</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-ai-transparency)"></div><div class="meta"><div class="n">Transparency</div><div class="h">#F8F4E3</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-ai-privacy)"></div><div class="meta"><div class="n">Privacy</div><div class="h">#DADADA</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-ai-bias)"></div><div class="meta"><div class="n">Bias monitor</div><div class="h">#F25C54</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-ai-risk)"></div><div class="meta"><div class="n">Risk alert</div><div class="h">#FFD93D</div></div></div>
</div></body></html>
