<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing scale" subtitle="4px base — 4 · 8 · 12 · 16 · 24 · 32 · 48" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-canvas);padding:20px}
.row{display:flex;align-items:flex-end;gap:20px}
.item{text-align:center}
.bar{background:var(--color-primary);border-radius:2px;width:100%}
.n{font-size:11px;font-weight:600;color:var(--color-text-primary);margin-top:8px}
.v{font-size:10px;color:var(--color-text-muted);font-feature-settings:'tnum' 1}</style></head>
<body><div class="row">
<div class="item" style="width:4px"><div class="bar" style="height:4px"></div><div class="n">1</div><div class="v">4</div></div>
<div class="item" style="width:8px"><div class="bar" style="height:8px"></div><div class="n">2</div><div class="v">8</div></div>
<div class="item" style="width:12px"><div class="bar" style="height:12px"></div><div class="n">3</div><div class="v">12</div></div>
<div class="item" style="width:16px"><div class="bar" style="height:16px"></div><div class="n">4</div><div class="v">16</div></div>
<div class="item" style="width:24px"><div class="bar" style="height:24px"></div><div class="n">6</div><div class="v">24</div></div>
<div class="item" style="width:32px"><div class="bar" style="height:32px"></div><div class="n">8</div><div class="v">32</div></div>
<div class="item" style="width:48px"><div class="bar" style="height:48px"></div><div class="n">12</div><div class="v">48</div></div>
</div></body></html>
