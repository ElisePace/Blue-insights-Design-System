<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Always colour + label, never colour alone" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-canvas);padding:16px}
.row{display:flex;gap:12px}
.sw{flex:1;border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden}
.chip{height:44px;display:flex;align-items:center;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:999px}
.meta{padding:8px 10px}
.n{font-size:11.5px;font-weight:600;color:var(--color-text-primary)}
.h{font-size:10.5px;font-weight:500;color:var(--color-text-muted);font-feature-settings:'tnum' 1;margin-top:2px}</style></head>
<body><div class="row">
<div class="sw"><div class="chip" style="background:var(--color-success-bg)"><span class="pill" style="color:var(--color-success-fg)"><span class="dot" style="background:var(--color-success)"></span>Confirmed</span></div><div class="meta"><div class="n">Success</div><div class="h">#16A34A</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-warning-bg)"><span class="pill" style="color:var(--color-warning-fg)"><span class="dot" style="background:var(--color-warning)"></span>Needs review</span></div><div class="meta"><div class="n">Warning</div><div class="h">#D97706</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-error-bg)"><span class="pill" style="color:var(--color-error-fg)"><span class="dot" style="background:var(--color-error)"></span>Blocked</span></div><div class="meta"><div class="n">Error</div><div class="h">#DC2626</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-info-bg)"><span class="pill" style="color:var(--color-info-fg)"><span class="dot" style="background:var(--color-info)"></span>Info</span></div><div class="meta"><div class="n">Info</div><div class="h">#0284C7</div></div></div>
</div></body></html>
