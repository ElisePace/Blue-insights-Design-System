<!-- @dsCard group="Colors" viewport="700x150" name="Brand & accent" subtitle="Neural Blue — the single dominant signal" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-canvas);padding:16px}
.row{display:flex;gap:12px}
.sw{flex:1;border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden}
.chip{height:56px}
.meta{padding:8px 10px}
.n{font-size:12px;font-weight:600;color:var(--color-text-primary)}
.h{font-size:11px;font-weight:500;color:var(--color-text-muted);font-feature-settings:'tnum' 1;margin-top:2px}</style></head>
<body><div class="row">
<div class="sw"><div class="chip" style="background:var(--color-primary)"></div><div class="meta"><div class="n">Primary · Neural Blue</div><div class="h">#034BDC</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-hover)"></div><div class="meta"><div class="n">Primary hover</div><div class="h">#0340BE</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-secondary)"></div><div class="meta"><div class="n">Secondary</div><div class="h">#0284C7</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-secondary-alt)"></div><div class="meta"><div class="n">Secondary alt</div><div class="h">#38BDF8</div></div></div>
</div></body></html>
