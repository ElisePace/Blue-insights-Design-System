<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals (light)" subtitle="Canvas, surfaces, borders & text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-canvas);padding:16px}
.row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.sw{border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
.chip{height:48px}
.meta{padding:6px 8px}
.n{font-size:10.5px;font-weight:600;color:var(--color-text-primary);line-height:1.25}
.h{font-size:10px;font-weight:500;color:var(--color-text-muted);font-feature-settings:'tnum' 1;margin-top:1px}</style></head>
<body><div class="row">
<div class="sw"><div class="chip" style="background:var(--color-canvas)"></div><div class="meta"><div class="n">Canvas</div><div class="h">#FFFFFF</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-surface-1)"></div><div class="meta"><div class="n">Surface 1</div><div class="h">#F8FAFC</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-surface-2)"></div><div class="meta"><div class="n">Surface 2</div><div class="h">#F1F5F9</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-border)"></div><div class="meta"><div class="n">Border</div><div class="h">#E2E8F0</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-text-primary)"></div><div class="meta"><div class="n">Text 1</div><div class="h">#0F172A</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-text-secondary)"></div><div class="meta"><div class="n">Text 2</div><div class="h">#475569</div></div></div>
<div class="sw"><div class="chip" style="background:var(--color-text-muted)"></div><div class="meta"><div class="n">Muted</div><div class="h">#64748B</div></div></div>
</div></body></html>
