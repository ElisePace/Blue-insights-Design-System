<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals (dark)" subtitle="Designed dark surfaces, tuned for contrast — not inverted" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:#0F172A;padding:16px}
.row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.sw{border:1px solid #334155;border-radius:var(--radius-md);overflow:hidden;background:#1E293B}
.chip{height:48px;border-bottom:1px solid #334155}
.meta{padding:6px 8px}
.n{font-size:10.5px;font-weight:600;color:#F1F5F9;line-height:1.25}
.h{font-size:10px;font-weight:500;color:#94A3B8;font-feature-settings:'tnum' 1;margin-top:1px}</style></head>
<body><div class="row" data-theme="dark">
<div class="sw"><div class="chip" style="background:#0F172A"></div><div class="meta"><div class="n">Canvas</div><div class="h">#0F172A</div></div></div>
<div class="sw"><div class="chip" style="background:#1E293B"></div><div class="meta"><div class="n">Surface 1</div><div class="h">#1E293B</div></div></div>
<div class="sw"><div class="chip" style="background:#334155"></div><div class="meta"><div class="n">Surface 2</div><div class="h">#334155</div></div></div>
<div class="sw"><div class="chip" style="background:#475569"></div><div class="meta"><div class="n">Border</div><div class="h">#475569</div></div></div>
<div class="sw"><div class="chip" style="background:#F1F5F9"></div><div class="meta"><div class="n">Text 1</div><div class="h">#F1F5F9</div></div></div>
<div class="sw"><div class="chip" style="background:#94A3B8"></div><div class="meta"><div class="n">Text 2</div><div class="h">#94A3B8</div></div></div>
<div class="sw"><div class="chip" style="background:#60A5FA"></div><div class="meta"><div class="n">Primary</div><div class="h">#60A5FA</div></div></div>
</div></body></html>
