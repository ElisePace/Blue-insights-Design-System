<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="6 · 8 · 10 · 12 · pill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-canvas);padding:20px;display:flex;gap:20px;align-items:flex-end}
.item{text-align:center}
.box{width:72px;height:56px;background:var(--color-primary-soft);border:1px solid var(--color-primary)}
.n{font-size:11px;font-weight:600;color:var(--color-text-primary);margin-top:8px}
.v{font-size:10px;color:var(--color-text-muted)}</style></head>
<body>
<div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="n">sm</div><div class="v">6px</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="n">md · buttons</div><div class="v">8px</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="n">lg</div><div class="v">10px</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="n">xl · cards</div><div class="v">12px</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-pill);width:56px"></div><div class="n">pill</div><div class="v">999px</div></div>
</body></html>
